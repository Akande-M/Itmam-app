/* Layout: one centred phone-width column; screens (home → play → handoff → results) swap with a short slide. Dark-first, light mirrored. */
:root{
  --bg:#0C100E; --surface:#141917; --surface-2:#1B211E; --line:#262E2A; --line-strong:#3A443F;
  --text:#ECE7DA; --muted:#8B938D; --faint:#5A625D;
  --gold:#D9B25F; --gold-soft:rgba(217,178,95,.14); --on-gold:#17130A;
  --ok:#3FB37F; --ok-soft:rgba(63,179,127,.14);
  --bad:#E0645A; --bad-soft:rgba(224,100,90,.14); --hard:#E98B4E;
  --p1:#D9B25F; --p2:#6FA8DC;
  --ui:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --quran:"Amiri Quran Embedded","Amiri Quran","Amiri","Scheherazade New","Traditional Arabic","Noto Naskh Arabic",serif;
  --r:12px; --tap:52px; --ayah:clamp(24px,6.6vw,31px); --opt:clamp(25px,7vw,30px);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F6F4EE; --surface:#FFFFFF; --surface-2:#EFECE4; --line:#E0DBCF; --line-strong:#C9C2B3;
  --text:#1B1F1C; --muted:#5F6661; --faint:#8F958F;
  --gold:#A2741A; --gold-soft:rgba(162,116,26,.12); --on-gold:#FFFFFF;
  --ok:#1D8A57; --ok-soft:rgba(29,138,87,.12); --bad:#C0453A; --bad-soft:rgba(192,69,58,.10); --hard:#C2611F;
  --p1:#A2741A; --p2:#2F6FA8; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F6F4EE; --surface:#FFFFFF; --surface-2:#EFECE4; --line:#E0DBCF; --line-strong:#C9C2B3;
  --text:#1B1F1C; --muted:#5F6661; --faint:#8F958F;
  --gold:#A2741A; --gold-soft:rgba(162,116,26,.12); --on-gold:#FFFFFF;
  --ok:#1D8A57; --ok-soft:rgba(29,138,87,.12); --bad:#C0453A; --bad-soft:rgba(192,69,58,.10); --hard:#C2611F;
  --p1:#A2741A; --p2:#2F6FA8; color-scheme:light}
:root.kid{--r:18px; --tap:60px; --ayah:clamp(28px,7.6vw,35px); --opt:clamp(29px,8vw,35px)}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:460px;margin:0 auto;min-height:100%;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;gap:16px;flex:1;animation:enter .35s ease-out}
@keyframes enter{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.label{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.gold-ink{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--muted);flex:none}

/* brand */
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-size:19px;font-weight:700}
.brand span.sub{color:var(--muted);font-size:13px}
.brand .ar{font-family:var(--quran);font-size:22px;color:var(--gold);margin-inline-start:auto;line-height:1}

/* home */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:92px}
.mode b{font-size:16px}
.mode span{color:var(--muted);font-size:12.5px;line-height:1.4}
.mode[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{min-height:40px;border:0;border-radius:8px;background:transparent;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.field{display:flex;flex-direction:column;gap:6px}
select,input[type=text]{width:100%;min-height:46px;background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit}
input[type=text]::placeholder{color:var(--faint)}
.names{display:grid;gap:10px}
.names.two{grid-template-columns:1fr 1fr}
.pname{display:flex;flex-direction:column;gap:6px;min-width:0}
.pname .tag{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.hint{color:var(--muted);font-size:13px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.switch{width:46px;height:28px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch[aria-checked="true"]{background:var(--gold-soft);border-color:var(--gold)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--gold)}
.reciters{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rec{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 12px;border:0;border-top:1px solid var(--line);background:var(--surface-2);cursor:pointer;text-align:left}
.rec:first-child{border-top:0}
.rec .ck{width:18px;color:var(--gold);font-weight:700}
.rec[aria-checked="true"]{background:var(--gold-soft)}
.rec .pv{margin-inline-start:auto;flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--gold);display:grid;place-items:center;cursor:pointer;transition:background .2s,color .2s}
.rec .pv:hover{border-color:var(--gold)}
.rec .pv.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn.sm{min-height:38px;padding:0 20px;font-size:14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.btn{min-height:var(--tap);border-radius:var(--r);border:0;background:var(--gold);color:var(--on-gold);font-weight:700;font-size:16px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.foot{margin-top:auto;padding-top:18px;color:var(--faint);font-size:11.5px;line-height:1.6}

/* play */
.top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px}
.dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot.cur{background:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}

  const markRight=()=>{const b=Game.optsEl.querySelector(`[data-i="${ci}"]`);b.classList.remove("dim");b.classList.add("ok");b.querySelector(".m").textContent="✓"};
  Game.fb.className="feedback "+(ok?"ok":soft?"rev":"bad");
  Game.fb.textContent=ok?(S.kid?["Excellent!","MashaAllah!","Well done!"][rand(3)]:"Correct"):timedOut?"Time's up":"Not this one";
  Game.secs.textContent="";Game.head.replaceChildren(h("span",{class:"label"},ok?"Well done":"The right answer"),h("span"));
  if(r.kind==="surah")showAllText();
  try{navigator.vibrate&&navigator.vibrate(ok?20:[30,40,30])}catch(e){}
  if(!ok)await new Promise(res=>setTimeout(res,700));
  if(Game.phase!=="reveal")return;markRight();
  const k=Game.k,last=Game.k===Game.rounds.length-1,duel=Game.players.length===2;
  const nextName=duel&&!last?Game.players[turnOf(k+1)].name:"";
  const label=last?"See results":duel?`${nextName}'s turn`:(r.kind==="ayah"?"Next verse":"Next surah");
  const countdown=h("span",{class:"hint"},r.kind==="ayah"?"Completing the recitation…":"");
  Game.next.replaceChildren(h("button",{class:"btn",id:"next",onclick:advance},label),countdown);
  if(r.kind==="ayah"){
    const blank=Game.words[r.i];blank.textContent=r.a.w[r.i];blank.classList.add("filled",ok?"ok":"rev");
    Game.words.forEach(w=>w.classList.remove("hide"));
    Game.extra.replaceChildren(h("div",{},h("b",{lang:"ar",style:"font-family:var(--quran);font-size:20px"},r.answer)," · ",r.a.t[r.i]||""," · ",h("b",{},r.a.g[r.i]||"")),h("div",{},`“${r.a.en}”`));
    Game.next.scrollIntoView({behavior:"smooth",block:"nearest"});
    await Audio.play(r.s,r.a,r.i,r.a.w.length);
  }else{
    Game.extra.replaceChildren(h("div",{},h("b",{},`${r.s.name} · ${r.s.en}`),` · ayah ${r.list[0].a}${r.list.length>1?"–"+r.list[r.list.length-1].a:""}`));
    Game.next.scrollIntoView({behavior:"smooth",block:"nearest"});
  }
  if(Game.phase!=="reveal"||Game.k!==k)return;
  let n=r.kind==="ayah"?3:(ok?2:3);countdown.textContent=`Next in ${n}…`;
  const step=()=>{if(Game.phase!=="reveal"||Game.k!==k)return;if(Game.hold){Game.autoT=setTimeout(step,500);return}n--;if(n<=0)return advance();countdown.textContent=`Next in ${n}…`;Game.autoT=setTimeout(step,1000)};
  Game.autoT=setTimeout(step,1000);
}
function advance(){
  clearTimeout(Game.autoT);Audio.stop();if(Game.phase!=="reveal")return;
  if(Game.k<Game.rounds.length-1){Game.phase="";Game.k++;loadRound();return}
  Game.phase="done";mount(Results(),false);
}

/* ---------- results ---------- */

  const again=h("button",{class:"btn",id:"again",onclick:()=>{Audio.unlock();startMatch()}},"Play again"),home=h("button",{class:"btn ghost",onclick:()=>go("home")},"Home");
  const fmt=ms=>(ms/1000).toFixed(1)+"s";
  const tCorrect=p=>ps[p].answers.filter(a=>a&&a.ok).reduce((x,a)=>x+a.ms,0);
  const refOf=r=>r.kind==="ayah"?`${r.s.n}:${r.a.a}`:r.s.name;
  const missItem=r=>{

      return h("div",{class:"missitem"},h("div",{class:"hd"},h("span",{class:"label"},`${r.s.name} · ${r.s.n}:${r.a.a}`),h("button",{class:"small",onclick:()=>{Audio.unlock();Audio.play(r.s,r.a)}},"▶ Listen")),ar,h("div",{class:"en"},h("b",{},r.a.g[r.i]||"")," · ",r.a.en))}
    return h("div",{class:"missitem"},h("div",{class:"hd"},h("span",{class:"label"},`${r.s.n}. ${r.s.name} · ${r.s.en}`),h("button",{class:"small",onclick:()=>{Audio.unlock();Audio.playAyahs(r.s,r.list)}},"▶ Listen")),
      h("div",{class:"ar",lang:"ar"},r.list.map(a=>a.w.join(" ")+" ۝"+arNum(a.a)).join(" ")))};
  const sub=`${GAME[S.game]} · ${LEVEL[S.level]} · ${rec(Audio.reciter).name}`;
  const top=h("div",{class:"top"},h("span"),h("span"),themeBtn());
  if(!duel){
    const c=score(0),times=ps[0].answers.filter(a=>a&&a.ok).map(a=>a.ms),missed=Game.rounds.filter((r,j)=>ps[0].answers[j]&&!ps[0].answers[j].ok).map(missItem);
    return h("section",{class:"screen"},top,
      h("div",{class:"center",style:"flex:none;padding-block:8px"},h("div",{class:"label"},`${ps[0].name} · ${sub}`),h("div",{class:"big"},c,h("small",{},` / ${N}`)),
        h("div",{class:"headline",style:"font-size:18px"},c===N?"Perfect score.":c>=7?"Strong revision.":c>=4?"Good start. Review the ones below.":"Keep going. Listen to the ones below.")),
      h("div",{class:"stats"},h("div",{class:"stat"},h("b",{},Math.round(c/N*100)+"%"),h("span",{},"Accuracy")),h("div",{class:"stat"},h("b",{},times.length?fmt(times.reduce((a,b)=>a+b,0)/times.length):"–"),h("span",{},"Avg answer")),h("div",{class:"stat"},h("b",{},String(N-c)),h("span",{},"To review"))),
      missed.length?h("div",{class:"label"},"Review"):null,missed.length?h("div",{class:"miss"},...missed):null,
      h("div",{class:"row2"},again,home));
  }
  const s0=score(0),s1=score(1);const w=s0>s1?0:s1>s0?1:tCorrect(0)<tCorrect(1)?0:tCorrect(1)<tCorrect(0)?1:-1;
  const tieBreak=s0===s1&&w>=0,each=[0,1].map(p=>Game.rounds.filter((_,j)=>turnOf(j)===p).length);
  const card=p=>h("div",{class:"stat"+(p===w?" win":"")},h("span",{style:`color:var(--p${p+1})`},`Player ${p+1}`),h("div",{class:"nm"},ps[p].name),h("div",{class:"bigs"},`${score(p)}`,h("small",{style:"font-size:16px;color:var(--muted)"},`/${each[p]}`)),h("span",{},`${fmt(tCorrect(p))} on correct answers`));
  const tbl=h("table",{class:"grid"},h("thead",{},h("tr",{},h("th",{},"#"),h("th",{},S.game==="ayah"?"Verse":"Surah"),h("th",{},"Player"),h("th",{},""))),
    h("tbody",{},...Game.rounds.map((r,j)=>{const p=turnOf(j),a=ps[p].answers[j];return h("tr",{},h("td",{},String(j+1)),h("td",{},refOf(r)),h("td",{style:`color:var(--p${p+1});font-weight:600`},ps[p].name),h("td",{class:a&&a.ok?"y":"n"},a&&a.ok?"✓":"✕"))})));
  return h("section",{class:"screen"},top,
    h("div",{class:"center",style:"flex:none;padding-block:8px"},h("div",{class:"label"},sub),h("div",{class:"headline",style:"font-size:28px"},w<0?"It's a draw":`${ps[w].name} wins`+(tieBreak?" on speed":"")),
      tieBreak?h("div",{class:"hint"},`Both scored ${s0}. The faster total time on correct answers wins.`):null),
    h("div",{class:"duel"},card(0),card(1)),h("div",{class:"tablewrap"},tbl),h("div",{class:"row2"},again,home));
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,select"))return;
  if(e.key==="Escape"&&$(".scrim")){$("#keep").click();return}
  if((Game.phase==="answer"||Game.phase==="answer-early")&&/^[1-4]$/.test(e.key)){const b=Game.optsEl&&Game.optsEl.querySelector(`[data-i="${+e.key-1}"]`);if(b&&!b.disabled)choose(+e.key-1)}
  else if(Game.phase==="answer"&&e.key===" "){e.preventDefault();togglePause()}
  else if(Game.phase==="reveal"&&e.key==="Enter"){e.preventDefault();advance()}
});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&Game.phase==="answer"&&S.mode==="solo"&&!Game.paused)togglePause()});
if("serviceWorker"in navigator&&location.protocol==="https:"&&!/claude|anthropic/.test(location.hostname)){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}

loadData().then(()=>{drawNav();go("home");getSurah(1).catch(()=>{})}).catch(()=>mount(h("div",{class:"loading"},"Couldn't load the Qur'an data. Reload the page to try again.")));
</script>
